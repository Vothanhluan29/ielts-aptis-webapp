services:
  db:
    image: postgres:alpine
    container_name: ielts_aptis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: ielts_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres_init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  backend:
    image: vothanhluan/ielts-aptis-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts_aptis_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:123456@db:5432/ielts_platform
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: vothanhluan/ielts-aptis-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ielts_aptis_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
